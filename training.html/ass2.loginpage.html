<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: #20243a;
            background: #f4f5fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
            background:
                radial-gradient(ellipse at 12% 8%, #e5e9ff 0, transparent 34%),
                radial-gradient(ellipse at 92% 92%, #f1e7ff 0, transparent 32%),
                #f7f8fc;
        }

        .form-card {
            width: min(100%, 680px);
            padding: clamp(26px, 5vw, 48px);
            border: 1px solid #e9eaf2;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 24px 70px rgb(41 48 92 / 10%);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #6257d9;
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.35rem);
            letter-spacing: -0.045em;
        }

        .intro {
            margin: 10px 0 30px;
            color: #73788d;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px 18px;
        }

        .field {
            min-width: 0;
        }

        .field.full-width,
        fieldset.full-width {
            grid-column: 1 / -1;
        }

        label,
        legend {
            display: block;
            margin-bottom: 9px;
            color: #343950;
            font-size: 0.9rem;
            font-weight: 650;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #dfe2ec;
            border-radius: 11px;
            outline: none;
            background: #fbfbfe;
            color: #252941;
            font: inherit;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #a1a5b5;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: #776be8;
            background: #fff;
            box-shadow: 0 0 0 4px rgb(119 107 232 / 13%);
        }

        fieldset {
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

        fieldset legend {
            padding: 0;
        }

        .choice-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .choice {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 42px;
            margin: 0;
            padding: 9px 12px;
            border: 1px solid #e5e6ef;
            border-radius: 10px;
            background: #fbfbfe;
            color: #51566c;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
        }

        .choice:has(input:checked) {
            border-color: #bcb5ff;
            background: #f2f0ff;
            color: #5146c6;
        }

        .choice input {
            accent-color: #685de0;
        }

        textarea {
            min-height: 112px;
            resize: vertical;
        }

        button {
            width: 100%;
            min-height: 50px;
            margin-top: 26px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(115deg, #6559db, #8068e8);
            box-shadow: 0 10px 22px rgb(101 89 219 / 24%);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 13px 26px rgb(101 89 219 / 30%);
        }

        button:focus-visible,
        .choice:focus-within {
            outline: 3px solid rgb(119 107 232 / 35%);
            outline-offset: 2px;
        }

        @media (max-width: 560px) {
            body {
                padding: 24px 14px;
            }

            .form-card {
                border-radius: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 19px;
            }

            .field.full-width,
            fieldset.full-width {
                grid-column: auto;
            }
        }
    </style>
</head>
<body>
    <main class="form-card">
        <p class="eyebrow">Start your learning journey</p>
        <h1>Student Registration</h1>
        <p class="intro">Fill in your details to get started. We’re excited to have you here!</p>

        <form>
            <div class="form-grid">
                <div class="field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="e.g. Aanya Sharma">
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>

                <fieldset class="full-width">
                    <legend>Gender</legend>
                    <div class="choice-list">
                        <label class="choice"><input type="radio" name="gender" value="male"> Male</label>
                        <label class="choice"><input type="radio" name="gender" value="female"> Female</label>
                    </div>
                </fieldset>

                <div class="field">
                    <label for="course">Choose a course</label>
                    <select id="course">
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="js">JavaScript</option>
                        <option value="python">Python</option>
                        <option value="java">Java</option>
                        <option value="csharp">C#</option>
                    </select>
                </div>

                <div class="field">
                    <label for="city">City</label>
                    <select id="city">
                        <option value="delhi">Delhi</option>
                        <option value="mumbai">Mumbai</option>
                        <option value="lucknow">Lucknow</option>
                        <option value="kolkata">Kolkata</option>
                        <option value="jaipur">Jaipur</option>
                    </select>
                </div>

                <fieldset class="full-width">
                    <legend>Subjects you’re interested in</legend>
                    <div class="choice-list">
                        <label class="choice"><input type="checkbox" name="subject" value="english"> English</label>
                        <label class="choice"><input type="checkbox" name="subject" value="math"> Math</label>
                        <label class="choice"><input type="checkbox" name="subject" value="hindi"> Hindi</label>
                        <label class="choice"><input type="checkbox" name="subject" value="science"> Science</label>
                    </div>
                </fieldset>

                <fieldset class="full-width">
                    <legend>Hobbies</legend>
                    <div class="choice-list">
                        <label class="choice"><input type="checkbox" name="hobby" value="reading"> Reading</label>
                        <label class="choice"><input type="checkbox" name="hobby" value="coding"> Coding</label>
                        <label class="choice"><input type="checkbox" name="hobby" value="gaming"> Gaming</label>
                    </div>
                </fieldset>

                <div class="field full-width">
                    <label for="feedback">Anything else you’d like us to know?</label>
                    <textarea id="feedback" placeholder="Share a little feedback or ask us a question..."></textarea>
                </div>
            </div>

            <button type="submit">Submit registration</button>
        </form>
    </main>
</body>
</html>
